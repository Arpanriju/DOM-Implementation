<!DOCTYPE html>
<html>
<head>
    <title>Hello & Color Boxes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="greeting">Hello</h1>
        <div class="user-input">
            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
            >
            <button id="greetBtn">Greet</button>
        </div>
        <div class="boxes">
            <div class="box" data-color="red">
                Red
            </div>
            <div class="box" data-color="blue">
                Blue
            </div>
            <div class="box" data-color="green">
                Green
            </div>
            <div class="box" data-color="yellow">
                Yellow
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
